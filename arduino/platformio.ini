; ============================================================================
; ESP32-S3-Touch-LCD-4B — PlatformIO / Arduino 框架移植工程
;
; 硬件：Waveshare ESP32-S3-Touch-LCD-4B
;   - 16MB Flash / 8MB Octal PSRAM / 480x480 RGB LCD (ST7701) / GT911 触摸
;
; 注意：
;   - Octal PSRAM 必须 qio_opi + psram=enabled，否则 PSRAM 不可用
;   - 官方 espressif32 platform 停在 arduino-esp32 2.x，本工程改用
;     pioarduino fork（arduino-esp32 3.x）
; ============================================================================

[env:esp32-s3-lcd4b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.05/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; --- 16MB Flash + 8MB Octal PSRAM 硬性前提 ---
board_build.arduino.memory_type = qio_opi
board_build.psram = enabled
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

; --- LVGL 配置：lv_conf.h 位于工程根，经 simple include 方式拾取 ---
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I.
    -O2
    -pthread

lib_deps =
    lvgl/lvgl@9.5.0
    moononournation/GFX Library for Arduino

monitor_speed = 115200
